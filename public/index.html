<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Faturamento</title>
    <link rel="icon" type="image/png" href="I.R.-COMERCIO-E-MATERIAIS-ELETRICOS-PRETO.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="loader"></div>
    </div>

    <div class="app-content">
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <h1>Pedido de Faturamento</h1>
                    <div id="connectionStatus" class="connection-status offline">
                        <span class="status-dot"></span>
                    </div>
                </div>
                <div class="header-actions">
                    <button onclick="toggleCalendar()" class="btn-calendar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </button>
                    <button onclick="showFormulario()" class="btn-new-order-header">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Novo Pedido
                    </button>
                </div>
            </div>

            <!-- Month Navigation -->
            <div class="month-navigation">
                <button onclick="changeMonth(-1)" class="month-nav-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <h2 id="currentMonth">Janeiro 2026</h2>
                <button onclick="changeMonth(1)" class="month-nav-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Dashboard Cards -->
            <div class="dashboard-grid">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-default">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value" id="totalPedidos">0</div>
                        <div class="stat-label">Total de Pedidos</div>
                    </div>
                </div>
                <div class="stat-card stat-card-success">
                    <div class="stat-icon stat-icon-success">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-success" id="totalEmitidos">0</div>
                        <div class="stat-label">Emitidos</div>
                    </div>
                </div>
                <div class="stat-card stat-card-warning">
                    <div class="stat-icon stat-icon-warning">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-warning" id="totalPendentes">0</div>
                        <div class="stat-label">Pendentes</div>
                    </div>
                </div>
                <div class="stat-card stat-card-info">
                    <div class="stat-icon stat-icon-info">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="23"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-info" id="valorTotal">R$ 0,00</div>
                        <div class="stat-label">Valor Total</div>
                    </div>
                </div>
            </div>

            <!-- Main Content: Lista ou Formulário -->
            <div id="mainContent">
                <!-- LISTA DE PEDIDOS -->
                <div id="listView" class="list-view">
                    <!-- Search Bar -->
                    <div class="search-bar-wrapper">
                        <div class="search-bar">
                            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <input type="text" id="search" placeholder="Pesquisar por Nº Pedido, Cliente ou CNPJ..." oninput="filterPedidos()">
                            
                            <div class="search-bar-filters">
                                <div class="filter-dropdown-inline">
                                    <select id="filterStatus" onchange="filterPedidos()">
                                        <option value="">Todos os Status</option>
                                        <option value="PENDENTE">Pendente</option>
                                        <option value="EMITIDO">Emitido</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nº Pedido</th>
                                    <th>Cliente</th>
                                    <th>CNPJ</th>
                                    <th>Status</th>
                                    <th>Valor Total</th>
                                    <th>Responsável</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="pedidosTable">
                                <tr>
                                    <td colspan="7" style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                                        Carregando pedidos...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- FORMULÁRIO DE PEDIDO -->
                <div id="formView" class="form-view" style="display: none;">
                    <div class="form-header">
                        <h2 id="formTitle">Novo Pedido</h2>
                        <button onclick="hideFormulario()" class="btn-close-form">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Warning de Estoque -->
                    <div id="estoqueWarning" class="estoque-warning" style="display: none;">
                        ⚠️ Não é possível confirmar a emissão deste pedido sem referência ao estoque
                    </div>

                    <!-- Tabs -->
                    <div class="form-tabs">
                        <button class="tab-btn active" onclick="switchTab(0)">Geral</button>
                        <button class="tab-btn" onclick="switchTab(1)">Faturamento</button>
                        <button class="tab-btn" onclick="switchTab(2)">Itens</button>
                        <button class="tab-btn" onclick="switchTab(3)">Entrega</button>
                        <button class="tab-btn" onclick="switchTab(4)">Transporte</button>
                    </div>

                    <form id="pedidoForm">
                        <!-- TAB 1: GERAL -->
                        <div class="tab-content active" id="tab-geral">
                            <div class="form-grid">
                                <div class="form-group form-group-small">
                                    <label>Nº do Pedido *</label>
                                    <input type="text" id="codigo" required>
                                </div>
                                <div class="form-group">
                                    <label>CNPJ/CPF *</label>
                                    <input type="text" id="cnpj" required maxlength="18" oninput="buscarClientePorCNPJ(this.value)">
                                    <div id="cnpjSuggestions" class="autocomplete-suggestions"></div>
                                </div>
                                <div class="form-group">
                                    <label>Razão Social *</label>
                                    <input type="text" id="razaoSocial" required>
                                </div>
                                <div class="form-group">
                                    <label>Vendedor</label>
                                    <input type="text" id="vendedor">
                                </div>
                                <div class="form-group">
                                    <label>Responsável *</label>
                                    <input type="text" id="responsavel" readonly style="background: var(--bg-secondary); cursor: not-allowed;">
                                </div>
                                <div class="form-group">
                                    <label>Data do Pedido</label>
                                    <input type="date" id="data_pedido" readonly style="background: var(--bg-secondary); cursor: not-allowed;">
                                </div>
                            </div>
                        </div>

                        <!-- TAB 2: FATURAMENTO -->
                        <div class="tab-content" id="tab-faturamento">
                            <div class="form-grid">
                                <div class="form-group form-group-small">
                                    <label>Documento</label>
                                    <input type="text" id="documento">
                                </div>
                                <div class="form-group">
                                    <label>Inscrição Estadual</label>
                                    <input type="text" id="inscricaoEstadual">
                                </div>
                                <div class="form-group">
                                    <label>Endereço</label>
                                    <input type="text" id="endereco">
                                </div>
                                <div class="form-group">
                                    <label>Telefone</label>
                                    <input type="text" id="telefone">
                                </div>
                                <div class="form-group">
                                    <label>Contato</label>
                                    <input type="text" id="contato">
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="email">
                                </div>
                            </div>
                        </div>

                        <!-- TAB 3: ITENS -->
                        <div class="tab-content" id="tab-itens">
                            <button type="button" onclick="addItem()" class="btn-add-item">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                Adicionar Item
                            </button>
                            <div id="itensContainer"></div>
                        </div>

                        <!-- TAB 4: ENTREGA -->
                        <div class="tab-content" id="tab-entrega">
                            <div class="form-grid">
                                <div class="form-group full-width">
                                    <label>Local de Entrega</label>
                                    <input type="text" id="localEntrega">
                                </div>
                                <div class="form-group">
                                    <label>Setor</label>
                                    <input type="text" id="setor">
                                </div>
                                <div class="form-group">
                                    <label>Previsão de Entrega</label>
                                    <input type="date" id="previsaoEntrega">
                                </div>
                                <div class="form-group">
                                    <label>Peso (kg)</label>
                                    <input type="number" id="peso" step="0.01" min="0">
                                </div>
                                <div class="form-group">
                                    <label>Quantidade</label>
                                    <input type="number" id="quantidade" min="1">
                                </div>
                                <div class="form-group">
                                    <label>Volumes</label>
                                    <input type="number" id="volumes" min="1">
                                </div>
                            </div>
                        </div>

                        <!-- TAB 5: TRANSPORTE -->
                        <div class="tab-content" id="tab-transporte">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Transportadora</label>
                                    <input type="text" id="transportadora">
                                </div>
                                <div class="form-group">
                                    <label>Valor do Frete</label>
                                    <input type="text" id="valorFrete">
                                </div>
                                <div class="form-group">
                                    <label>Valor Total do Pedido</label>
                                    <input type="number" id="valorTotalPedido" step="0.01" min="0">
                                </div>
                                <div class="form-group full-width">
                                    <label>Observações</label>
                                    <textarea id="observacoes" rows="4"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <button type="button" onclick="hideFormulario()" class="btn-secondary">Cancelar</button>
                            <button type="submit" class="btn-primary">Salvar Pedido</button>
                            <button type="button" id="btnConfirmarEmissao" onclick="confirmarEmissao()" class="btn-success" style="display: none;">
                                Confirmar Emissão
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CALENDÁRIO -->
    <div class="modal-overlay" id="calendarModal" style="display: none;">
        <div class="modal-content modal-calendar">
            <div class="modal-header">
                <h3>Selecionar Mês</h3>
                <button class="close-modal" onclick="toggleCalendar()">✕</button>
            </div>
            <div class="calendar-year-nav">
                <button onclick="changeCalendarYear(-1)" class="year-nav-btn">‹</button>
                <h3 id="calendarYear">2026</h3>
                <button onclick="changeCalendarYear(1)" class="year-nav-btn">›</button>
            </div>
            <div class="calendar-months" id="calendarMonths"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
